<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Séance Muscu — Kevin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0a0a0b',
          card: '#17171a',
          card2: '#1f1f24',
          accent: '#ff5722',
          accent2: '#ff8a50',
        }
      }
    }
  }
</script>
<style>
  html, body { background:#0a0a0b; -webkit-tap-highlight-color: transparent; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; }
  .no-scrollbar::-webkit-scrollbar{ display:none; }
  @keyframes pulse-ring { 0%{transform:scale(.95);opacity:.7} 70%{transform:scale(1.05);opacity:0} 100%{opacity:0} }
  .timer-ring{ animation: pulse-ring 1.4s cubic-bezier(.4,0,.6,1) infinite; }
  .done-glow{ box-shadow: 0 0 0 1px #22c55e55, 0 0 18px -4px #22c55e88; }
</style>
</head>
<body class="text-gray-100 antialiased pb-40">

<!-- ===== SÉLECTEUR (si pas de ?session=) ===== -->
<div id="selector" class="hidden min-h-screen flex-col items-center justify-center px-6 gap-6">
  <div class="text-center mb-2">
    <h1 class="text-3xl font-black tracking-tight">💪 Séance du jour</h1>
    <p class="text-gray-500 mt-1 text-sm">Choisis ta séance</p>
  </div>
  <div id="selector-grid" class="grid grid-cols-2 gap-4 w-full max-w-md"></div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hidden max-w-xl mx-auto">
  <!-- Header -->
  <header class="sticky top-0 z-30 backdrop-blur-md bg-bg/90 border-b border-white/5 px-4 py-3">
    <div class="flex items-center justify-between gap-3">
      <div class="min-w-0">
        <h1 id="h-title" class="text-2xl font-black tracking-tight leading-none truncate"></h1>
        <p id="h-date" class="text-xs text-gray-500 mt-0.5"></p>
      </div>
      <button id="finishBtn"
        class="shrink-0 bg-accent hover:bg-accent2 active:scale-95 transition text-white font-bold text-sm px-4 py-3 rounded-xl shadow-lg shadow-accent/20">
        ✅ Terminer
      </button>
    </div>
    <div id="progress-wrap" class="mt-3 h-1.5 bg-white/5 rounded-full overflow-hidden">
      <div id="progress-bar" class="h-full bg-gradient-to-r from-accent to-accent2 rounded-full transition-all duration-500" style="width:0%"></div>
    </div>
  </header>

  <main id="exos" class="px-3 pt-4 space-y-5"></main>

  <footer class="px-3 mt-6">
    <button id="copyBtn"
      class="w-full bg-accent hover:bg-accent2 active:scale-[.98] transition text-white font-black text-lg py-5 rounded-2xl shadow-xl shadow-accent/25">
      📋 Copier les résultats
    </button>
    <p class="text-center text-gray-600 text-xs mt-3">Format prêt pour ton coach IA · Telegram</p>
  </footer>
</div>

<!-- ===== TIMER OVERLAY ===== -->
<div id="timer" class="hidden fixed inset-0 z-50 bg-black/92 backdrop-blur-sm flex flex-col items-center justify-center px-6">
  <p id="timer-exo" class="text-gray-400 text-sm mb-2 text-center"></p>
  <p class="text-accent font-bold uppercase tracking-widest text-xs mb-6">Repos</p>
  <div class="relative flex items-center justify-center mb-10">
    <div class="absolute w-64 h-64 rounded-full bg-accent/20 timer-ring"></div>
    <svg class="w-64 h-64 -rotate-90" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="45" fill="none" stroke="#ffffff10" stroke-width="6"/>
      <circle id="timer-circle" cx="50" cy="50" r="45" fill="none" stroke="#ff5722" stroke-width="6"
        stroke-linecap="round" stroke-dasharray="283" stroke-dashoffset="0"/>
    </svg>
    <div class="absolute text-center">
      <div id="timer-num" class="text-7xl font-black tabular-nums">0:00</div>
    </div>
  </div>
  <div class="flex gap-3 w-full max-w-sm">
    <button id="timer-add" class="flex-1 bg-card2 hover:bg-white/10 active:scale-95 transition font-bold py-5 rounded-2xl text-lg">+30s</button>
    <button id="timer-skip" class="flex-1 bg-accent hover:bg-accent2 active:scale-95 transition text-white font-black py-5 rounded-2xl text-lg">SKIP ⏭</button>
  </div>
</div>

<!-- ===== LIGHTBOX IMAGE ===== -->
<div id="lightbox" class="hidden fixed inset-0 z-[70] bg-black/90 backdrop-blur-sm items-center justify-center p-6" onclick="closeImg()">
  <img id="lightbox-img" src="" alt="" class="max-w-full max-h-[85vh] object-contain rounded-2xl bg-white">
  <button class="absolute top-5 right-5 bg-white/10 hover:bg-white/20 active:scale-90 transition text-white font-black w-11 h-11 rounded-full text-xl" onclick="event.stopPropagation();closeImg()">✕</button>
</div>

<!-- ===== TOAST ===== -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] bg-green-600 text-white font-bold px-5 py-3 rounded-full shadow-2xl opacity-0 pointer-events-none transition-all duration-300 text-sm"></div>

<script>
// ====================== DONNÉES ======================

    {"nom":"Développé incliné haltères","emoji":"💪","type":"compound","series":3,"reps":"8-12","repos":"2 min","repos_s":120,"rir":1,"tempo":"3010","last_performance":{"poids":[20,15,15],"reps":[7,12,12]},"objectif_next":"15kg×12-12-12 (structure régulière)","notes":"Incohérence charge départ 20kg→15kg — standardiser"},
    {"nom":"Dips assistés (prise large)","emoji":"🤸","type":"compound","series":3,"reps":"10","repos":"90s","repos_s":90,"rir":2,"tempo":"2010","last_performance":{"assistance":[35,35,35],"reps":[10,10,10]},"objectif_next":"Réduire assistance à 30kg si RIR facile","notes":""},

    {"nom":"Élévations latérales haltères","emoji":"🛩️","type":"isolation","series":3,"reps":"10-12","repos":"60s","repos_s":60,"rir":2,"tempo":"2011","last_performance":{"poids":[5,5,5],"reps":[12,12,10]},"objectif_next":"5kg×12-12-12","notes":"POINT FAIBLE — priorité épaules","point_faible":true},
    {"nom":"Extensions triceps poulie haute","emoji":"🔻","type":"isolation","series":2,"reps":"15","repos":"60s","repos_s":60,"rir":2,"tempo":"2011","last_performance":{"poids":[45,45],"reps":[15,15]},"objectif_next":"45kg×15-15 (maintenir)","notes":"Objectif atteint, parfaitement stable"}

    {"nom":"Squat Smith Machine","emoji":"🦵","type":"compound","series":4,"reps":"8-12","repos":"2-3 min","repos_s":150,"rir":1,"tempo":"3010","last_performance":{"note":"Calibration technique — charges légères"},"objectif_next":"Stabiliser technique avant progression charge","notes":"Apprentissage technique (profondeur, alignement genoux). Pieds légèrement avancés, dos neutre"},

  ]}
};

// ====================== ILLUSTRATIONS EXERCICES ======================
// Photos réelles (free-exercise-db, open source, CC0) — testées HTTP 200
const IMG_BASE = "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/";
const IMG_MAP = {
  "Développé couché barre":            "Barbell_Bench_Press_-_Medium_Grip/0.jpg",
  "Développé incliné haltères":        "Incline_Dumbbell_Press/0.jpg",
  "Dips assistés (prise large)":       "Dips_-_Triceps_Version/0.jpg",
  "Dips assistés":                     "Dips_-_Triceps_Version/0.jpg",
  "Élévations latérales haltères":     "Side_Lateral_Raise/0.jpg",
  "Extensions triceps poulie haute":   "Triceps_Pushdown/0.jpg",
  "Tirage vertical (lat pulldown)":    "Wide-Grip_Lat_Pulldown/0.jpg",
  "Rowing barre droite":               "Bent_Over_Barbell_Row/0.jpg",
  "Tirage horizontal poulie basse":    "Seated_Cable_Rows/0.jpg",
  "Curl barre EZ (pupitre isolé)":     "Preacher_Curl/0.jpg",
  "Curl marteau haltères":             "Hammer_Curls/0.jpg",
  "Squat Smith Machine":               "Smith_Machine_Squat/0.jpg",
  "Leg Press assis":                   "Leg_Press/0.jpg",
  "Romanian Deadlift barre":           "Romanian_Deadlift/0.jpg",
  "Leg Curl allongé":                  "Lying_Leg_Curls/0.jpg",
  "Leg Extension":                     "Leg_Extensions/0.jpg",
  "Hip Thrust":                        "Barbell_Hip_Thrust/0.jpg"
};
function imgUrl(nom){ const p = IMG_MAP[nom]; return p ? IMG_BASE + p : ''; }

// Fallback si l'image ne charge pas → emoji + nom
function imgFail(el){
  const box = el.parentElement;
  box.classList.remove('bg-white');
  box.classList.add('bg-card2/60');
  box.innerHTML = `<div class="flex flex-col items-center justify-center gap-1 px-1 text-center">
    <div class="text-4xl">${el.dataset.emoji||'🏋️'}</div>
    <div class="text-[9px] leading-tight text-gray-500">${el.dataset.nom||''}</div>
  </div>`;
}

// Lightbox — clic pour agrandir
function openImg(src){
  const lb = document.getElementById('lightbox');
  document.getElementById('lightbox-img').src = src;
  lb.classList.remove('hidden'); lb.classList.add('flex');
}
function closeImg(){
  const lb = document.getElementById('lightbox');
  lb.classList.add('hidden'); lb.classList.remove('flex');
}

// ====================== ROUTAGE ======================
const params = new URLSearchParams(location.search);
let sessionKey = (params.get('session') || '').toUpperCase();
const selectorEl = document.getElementById('selector');
const appEl = document.getElementById('app');

if (DATA[sessionKey]) {
  renderApp(sessionKey);
} else {
  renderSelector();
}

function renderSelector(){
  selectorEl.classList.remove('hidden');
  selectorEl.classList.add('flex');
  const grid = document.getElementById('selector-grid');
  const meta = {
    PUSH_A:{e:'🔥',c:'from-red-500/20 to-orange-500/10 border-orange-500/30'},
    PULL_A:{e:'🎣',c:'from-blue-500/20 to-cyan-500/10 border-blue-500/30'},
    LEGS:{e:'🦵',c:'from-purple-500/20 to-fuchsia-500/10 border-purple-500/30'},
    PUSH_B:{e:'💥',c:'from-amber-500/20 to-orange-500/10 border-amber-500/30'},
  };
  ['PUSH_A','PULL_A','LEGS','PUSH_B'].forEach(k=>{
    const d = DATA[k], m = meta[k];
    const a = document.createElement('a');
    a.href = '?session='+k;
    a.className = `bg-gradient-to-br ${m.c} border rounded-3xl p-6 flex flex-col items-center justify-center gap-2 active:scale-95 transition aspect-square`;
    a.innerHTML = `<div class="text-5xl">${m.e}</div>
      <div class="font-black text-lg">${d.nom.toUpperCase()}</div>
      <div class="text-xs text-gray-400">${d.exercices.length} exercices</div>`;
    grid.appendChild(a);
  });
}

// ====================== RENDU SÉANCE ======================
function fmtDate(){
  return new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
}
function lastPerfStr(lp){
  if(!lp) return '';
  if(lp.poids && lp.reps) return lp.poids.map((p,i)=>`${p}×${lp.reps[i]}`).join(' · ');
  if(lp.assistance && lp.reps) return lp.assistance.map((p,i)=>`aide ${p}kg×${lp.reps[i]}`).join(' · ');
  if(lp.details) return lp.details;
  if(lp.note) return lp.note;
  return '';
}

function renderApp(key){
  const s = DATA[key];
  appEl.classList.remove('hidden');
  document.getElementById('h-title').textContent = s.nom.toUpperCase();
  document.getElementById('h-date').textContent = fmtDate();

  const container = document.getElementById('exos');
  s.exercices.forEach((ex, ei)=>{
    const card = document.createElement('section');
    card.className = 'bg-card rounded-3xl overflow-hidden border border-white/5';
    card.dataset.exo = ei;

    const pf = ex.point_faible;
    const last = lastPerfStr(ex.last_performance);

    let seriesHTML = '';
    for(let si=0; si<ex.series; si++){
      // valeur poids par défaut = dernière perf si dispo
      let defP = '';
      if(ex.last_performance){
        if(ex.last_performance.poids && ex.last_performance.poids[si]!=null) defP = ex.last_performance.poids[si];
        else if(ex.last_performance.assistance && ex.last_performance.assistance[si]!=null) defP = ex.last_performance.assistance[si];
      }
      const unit = ex.last_performance && ex.last_performance.assistance ? 'aide' : 'kg';
      seriesHTML += `
      <div class="flex items-center gap-2" data-serie="${si}">
        <div class="w-7 shrink-0 text-center text-xs font-bold text-gray-500">S${si+1}</div>
        <div class="flex-1 grid grid-cols-2 gap-2">
          <div class="relative">
            <input type="number" inputmode="decimal" placeholder="${defP!==''?defP:'—'}"
              class="inp-poids w-full bg-card2 border border-white/5 rounded-xl px-3 py-3 text-center text-lg font-bold focus:border-accent focus:outline-none">
            <span class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-gray-600 pointer-events-none">${unit}</span>
          </div>
          <div class="relative">
            <input type="number" inputmode="numeric" placeholder="reps"
              class="inp-reps w-full bg-card2 border border-white/5 rounded-xl px-3 py-3 text-center text-lg font-bold focus:border-accent focus:outline-none">
            <span class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-gray-600 pointer-events-none">rep</span>
          </div>
        </div>
        <button class="ok-btn w-14 shrink-0 bg-card2 border border-white/10 hover:border-accent active:scale-90 transition rounded-xl py-3 font-black text-sm"
          data-repos="${ex.repos_s}" data-exo="${ei}">OK</button>
      </div>`;
    }

    card.innerHTML = `
      <div class="flex items-stretch">
        <div class="w-28 shrink-0 bg-white flex items-center justify-center overflow-hidden p-1">
          <img src="${imgUrl(ex.nom)}" alt="${ex.nom}" loading="lazy"
            data-emoji="${ex.emoji||'🏋️'}" data-nom="${ex.nom}"
            onclick="openImg(this.src)" onerror="imgFail(this)"
            class="w-full object-contain cursor-zoom-in" style="max-height:120px">
        </div>
        <div class="flex-1 p-3 min-w-0">
          <div class="flex items-start justify-between gap-2">
            <h2 class="font-bold text-base leading-tight">${ex.nom}</h2>
            ${pf?`<span class="shrink-0 bg-accent/20 text-accent2 text-[10px] font-black uppercase px-2 py-1 rounded-full border border-accent/40">⚠ Point faible</span>`:''}
          </div>
          <div class="flex flex-wrap gap-x-3 gap-y-0.5 mt-1 text-[11px] text-gray-500">
            <span>${ex.series}×${ex.reps}</span>
            <span>RIR ${ex.rir}</span>
            <span>Tempo ${ex.tempo}</span>
            <span>Repos ${ex.repos}</span>
          </div>
        </div>
      </div>

      <div class="px-3 pb-3">
        <div class="bg-card2/40 rounded-xl px-3 py-2 mb-3">
          <div class="text-green-400 font-bold text-sm">🎯 ${ex.objectif_next}</div>
          ${last?`<div class="text-gray-500 text-xs mt-0.5">Dernière : ${last}</div>`:''}
        </div>
        <div class="space-y-2">${seriesHTML}</div>
        ${ex.notes?`<p class="text-gray-500 text-[11px] mt-3 leading-snug">📝 ${ex.notes}</p>`:''}
      </div>`;
    container.appendChild(card);
  });

  // Listeners boutons OK
  container.querySelectorAll('.ok-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const row = btn.closest('[data-serie]');
      row.querySelector('.done-glow'); // noop
      // marquer la ligne validée
      row.classList.add('done-glow','rounded-xl','p-1','-m-1');
      btn.textContent = '✓';
      btn.classList.remove('bg-card2','border-white/10');
      btn.classList.add('bg-green-600','border-green-500','text-white');
      updateProgress();
      startTimer(parseInt(btn.dataset.repos,10), row.closest('[data-exo]').querySelector('h2').textContent);
    });
  });

  document.getElementById('copyBtn').addEventListener('click', copyResults);
  document.getElementById('finishBtn').addEventListener('click', copyResults);
  updateProgress();
}

function updateProgress(){
  const total = document.querySelectorAll('.ok-btn').length;
  const done = document.querySelectorAll('.ok-btn.bg-green-600').length;
  document.getElementById('progress-bar').style.width = (total?done/total*100:0)+'%';
}

// ====================== TIMER ======================
let timerId=null, timerRemaining=0, timerTotal=0;
const timerEl = document.getElementById('timer');
const timerNum = document.getElementById('timer-num');
const timerCircle = document.getElementById('timer-circle');
const CIRC = 283;

function fmtTime(s){ const m=Math.floor(s/60), r=s%60; return `${m}:${String(r).padStart(2,'0')}`; }

function paintTimer(){
  timerNum.textContent = fmtTime(timerRemaining);
  const frac = timerTotal ? timerRemaining/timerTotal : 0;
  timerCircle.style.strokeDashoffset = CIRC*(1-frac);
}

function startTimer(seconds, exoName){
  seconds = seconds || 90;
  timerRemaining = seconds; timerTotal = seconds;
  document.getElementById('timer-exo').textContent = exoName || '';
  timerEl.classList.remove('hidden'); timerEl.classList.add('flex');
  paintTimer();
  clearInterval(timerId);
  timerId = setInterval(()=>{
    timerRemaining--;
    if(timerRemaining<=0){ paintTimer(); endTimer(); return; }
    paintTimer();
  },1000);
}

function closeTimer(){
  clearInterval(timerId); timerId=null;
  timerEl.classList.add('hidden'); timerEl.classList.remove('flex');
}

function endTimer(){
  beep(); vibrate([200,100,200,100,300]);
  timerNum.textContent = 'GO 💥';
  timerCircle.style.strokeDashoffset = 0;
  setTimeout(closeTimer, 1200);
}

document.getElementById('timer-skip').addEventListener('click', closeTimer);
document.getElementById('timer-add').addEventListener('click', ()=>{
  timerRemaining += 30; timerTotal += 30; paintTimer();
});

// ---- Son (Web Audio) ----
let audioCtx=null;
function beep(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const notes=[880,1174,1568];
    notes.forEach((f,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='sine'; o.frequency.value=f;
      const t=audioCtx.currentTime + i*0.18;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.4,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t+0.18);
    });
  }catch(e){}
}
function vibrate(pat){ if(navigator.vibrate) navigator.vibrate(pat); }
// débloque l'audio au 1er tap

// ====================== COPIE RÉSULTATS ======================
function copyResults(){
  const s = DATA[sessionKey];
  const dateStr = new Date().toLocaleDateString('fr-FR');
  let out = `SEANCE: ${s.nom.toUpperCase()} - ${dateStr}\n\n`;
  const cards = document.querySelectorAll('#exos > section');
  cards.forEach((card, ei)=>{
    const name = card.querySelector('h2').textContent;
    const rows = card.querySelectorAll('[data-serie]');
    const parts = [];
    rows.forEach((row, si)=>{
      const p = row.querySelector('.inp-poids');
      const r = row.querySelector('.inp-reps');
      const pv = p.value.trim() || p.placeholder.replace('—','');
      const rv = r.value.trim();
      if(pv || rv){
        parts.push(`S${si+1}: ${pv?pv+'kg':'—'} x ${rv||'—'}`);
      }
    });
    out += `Exercice ${ei+1}: ${name}\n`;
    out += parts.length ? parts.join(' | ') + '\n\n' : '(non renseigné)\n\n';
  });
  out = out.trimEnd() + '\n';

  copyToClipboard(out);
}

function copyToClipboard(text){
  const done = ()=> showToast('✅ Copié — colle-le dans Telegram');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else {
    fallbackCopy(text,done);
  }
}
function fallbackCopy(text,cb){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){ prompt('Copie manuelle :', text); }
  document.body.removeChild(ta);
}

const toastEl = document.getElementById('toast');
let toastTid=null;
function showToast(msg){
  toastEl.textContent=msg;
  toastEl.classList.remove('opacity-0');
  toastEl.classList.add('opacity-100');
  clearTimeout(toastTid);
  toastTid=setTimeout(()=>{ toastEl.classList.add('opacity-0'); toastEl.classList.remove('opacity-100'); },2500);
}
