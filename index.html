<style>

<body class="text-gray-100 antialiased pb-40">

<!-- ===== SÉLECTEUR (si pas de ?session=) ===== -->
<div id="selector" class="hidden min-h-screen flex-col items-center justify-center px-6 gap-6">
  <div class="text-center mb-2">
    <h1 class="text-3xl font-black tracking-tight">💪 Séance du jour</h1>
    <p class="text-gray-500 mt-1 text-sm">Choisis ta séance</p>
  </div>
  <div id="selector-grid" class="grid grid-cols-2 gap-4 w-full max-w-md"></div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hidden max-w-xl mx-auto">
  <!-- Header -->
  <header class="sticky top-0 z-30 backdrop-blur-md bg-bg/90 border-b border-white/5 px-4 py-3">
    <div class="flex items-center justify-between gap-3">
      <div class="min-w-0">
        <h1 id="h-title" class="text-2xl font-black tracking-tight leading-none truncate"></h1>
        <p id="h-date" class="text-xs text-gray-500 mt-0.5"></p>
      </div>
      <button id="finishBtn"
        class="shrink-0 bg-accent hover:bg-accent2 active:scale-95 transition text-white font-bold text-sm px-4 py-3 rounded-xl shadow-lg shadow-accent/20">
        ✅ Terminer
      </button>
    </div>
    <div id="progress-wrap" class="mt-3 h-1.5 bg-white/5 rounded-full overflow-hidden">
      <div id="progress-bar" class="h-full bg-gradient-to-r from-accent to-accent2 rounded-full transition-all duration-500" style="width:0%"></div>
    </div>
  </header>

  <main id="exos" class="px-3 pt-4 space-y-5"></main>

  <footer class="px-3 mt-6">
    <button id="copyBtn"
      class="w-full bg-accent hover:bg-accent2 active:scale-[.98] transition text-white font-black text-lg py-5 rounded-2xl shadow-xl shadow-accent/25">
      📋 Copier les résultats
    </button>
    <p class="text-center text-gray-600 text-xs mt-3">Format prêt pour ton coach IA · Telegram</p>
  </footer>
</div>

<!-- ===== TIMER OVERLAY ===== -->
<div id="timer" class="hidden fixed inset-0 z-50 bg-black/92 backdrop-blur-sm flex flex-col items-center justify-center px-6">
  <p id="timer-exo" class="text-gray-400 text-sm mb-2 text-center"></p>
  <p class="text-accent font-bold uppercase tracking-widest text-xs mb-2">Repos</p>
  <p id="timer-pause" class="hidden text-amber-400 font-bold text-sm mb-3 animate-pulse">⏱ Le décompte continue en arrière-plan</p>
  <div class="relative flex items-center justify-center mb-10">
    <div class="absolute w-64 h-64 rounded-full bg-accent/20 timer-ring"></div>
    <svg class="w-64 h-64 -rotate-90" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="45" fill="none" stroke="#ffffff10" stroke-width="6"/>
      <circle id="timer-circle" cx="50" cy="50" r="45" fill="none" stroke="#ff5722" stroke-width="6"
        stroke-linecap="round" stroke-dasharray="283" stroke-dashoffset="0"/>
    </svg>
    <div class="absolute text-center">
      <div id="timer-num" class="text-7xl font-black tabular-nums">0:00</div>
    </div>
  </div>
  <div class="flex gap-3 w-full max-w-sm">
    <button id="timer-add" class="flex-1 bg-card2 hover:bg-white/10 active:scale-95 transition font-bold py-5 rounded-2xl text-lg">+30s</button>
    <button id="timer-skip" class="flex-1 bg-accent hover:bg-accent2 active:scale-95 transition text-white font-black py-5 rounded-2xl text-lg">SKIP ⏭</button>
  </div>
</div>

function imgUrl(nom){ const p = IMG_MAP[nom]; return p ? IMG_BASE + p : ''; }
// Slug du dossier (sans /0.jpg) → permet de dériver 0.jpg (départ) ET 1.jpg (exécution)
function imgSlug(nom){ const p = IMG_MAP[nom]; return p ? p.replace(/\/0\.jpg$/,'') : ''; }
function galleryUrls(nom){
  const s = imgSlug(nom);
  return s ? [IMG_BASE+s+'/0.jpg', IMG_BASE+s+'/1.jpg'] : [];
}
const GALLERY_LABELS = ['Départ', 'Exécution'];

// Fallback si une photo de la galerie ne charge pas.
// Si une seule des deux vues manque (ex: 1.jpg en 404) → on retire proprement la vignette
// et l'autre vue (0.jpg) occupe toute la largeur, sans casser la mise en page.
// Si plus aucune photo ne charge → emoji + nom (mode offline).
function imgFail(el){
  const fig = el.closest('figure') || el.parentElement;
  const grid = fig.parentElement;
  const remaining = grid ? grid.querySelectorAll('figure').length : 1;
  if(remaining > 1){
    // Il reste au moins une autre vue : on supprime la vignette cassée et on repasse en 1 colonne
    fig.remove();
    if(grid){
      grid.classList.remove('grid-cols-2');
      grid.classList.add('grid-cols-1');
    }
    return;
  }
  // Dernière vue → fallback emoji propre
  fig.classList.remove('bg-white'); fig.classList.add('bg-card2/60');
  fig.innerHTML = `<div class="flex flex-col items-center justify-center gap-1 px-1 text-center" style="height:120px">
    <div class="text-4xl">${el.dataset.emoji||'🏋️'}</div>
    <div class="text-[9px] leading-tight text-gray-500">${el.dataset.nom||''}</div>
  </div>`;
}

const WGER_BASE = "https://wger.de/static/images/muscles/";

  1:{n:"Biceps",v:"front"}, 2:{n:"Deltoïde",v:"front"}, 4:{n:"Pectoraux",v:"front"},
  5:{n:"Triceps",v:"back"}, 8:{n:"Fessiers",v:"back"}, 9:{n:"Trapèzes",v:"back"},
  10:{n:"Quadriceps",v:"front"}, 11:{n:"Ischios",v:"back"}, 12:{n:"Dorsaux",v:"back"},
  13:{n:"Brachial",v:"front"}
};
// Mapping muscle→exercice cohérent pour TOUT le programme (ordre = primaire → secondaires).
// wger n'expose que le deltoïde ANTÉRIEUR (id 2) : on l'utilise comme plus proche
// dispo pour "deltoïde antérieur" (développés/dips) ET comme proxy épaule pour les
// élévations latérales (pas de deltoïde latéral isolé chez wger). Trapèzes (9) sert de
// proxy "haut du dos / deltoïde postérieur" sur le rowing.
const MUSCLE_MAP = {
  "Développé couché barre":[4,5,2],            // pectoraux + triceps + deltoïde ant.
  "Développé incliné haltères":[4,5,2],        // pectoraux + triceps + deltoïde ant.
  "Dips assistés (prise large)":[5,4,2],       // triceps + pectoraux + deltoïde ant.
  "Dips assistés":[5,4,2],                     // triceps + pectoraux + deltoïde ant.
  "Élévations latérales haltères":[2],         // deltoïde (latéral → plus proche dispo)
  "Extensions triceps poulie haute":[5],       // triceps
  "Tirage vertical (lat pulldown)":[12,1],     // grand dorsal + biceps
  "Rowing barre droite":[12,1,9],              // dorsaux + biceps + trapèzes (haut du dos)
  "Tirage horizontal poulie basse":[12,1],     // dorsaux + biceps
  "Curl barre EZ (pupitre isolé)":[1],         // biceps
  "Curl marteau haltères":[1,13],              // biceps + brachial antérieur
  "Squat Smith Machine":[10,8],                // quadriceps + fessiers
  "Leg Press assis":[10,8],                    // quadriceps + fessiers
  "Romanian Deadlift barre":[11,8],            // ischio-jambiers + fessiers
  "Leg Curl allongé":[11],                     // ischio-jambiers
  "Leg Extension":[10],                        // quadriceps
  "Hip Thrust":[8]                             // fessiers

function muscleFigHTML(id){
  const m = MUSCLE_DB[id]; if(!m) return '';
  const base = WGER_BASE+'muscular_system_'+m.v+'.svg';
  const overlay = WGER_BASE+'main/muscle-'+id+'.svg';
  return `<div class="flex flex-col items-center gap-1 w-14 shrink-0">
    <div class="muscle-fig relative w-14 rounded-lg overflow-hidden bg-white p-0.5" style="aspect-ratio:200/369" data-name="${m.n}">
      <img src="${base}" alt="" loading="lazy" class="absolute inset-0 w-full h-full object-contain" onerror="muscleFail(this)">
      <img src="${overlay}" alt="${m.n}" loading="lazy" class="absolute inset-0 w-full h-full object-contain">
    </div>
    <span class="text-[8px] leading-tight text-accent2 text-center font-bold">${m.n}</span>
  </div>`;
}
function muscleFail(el){
  // Le corps de base n'a pas chargé → pastille rouge "muscle en rouge" intégrée (fallback offline)
  const fig = el.closest('.muscle-fig'); if(!fig) return;
  const name = fig.dataset.name || '';
  fig.innerHTML = `<div class="absolute inset-0 flex items-center justify-center">
    <svg viewBox="0 0 40 74" class="w-full h-full"><g stroke="#334155" stroke-width="1.4" fill="#1f1f24">
      <circle cx="20" cy="9" r="6"/><rect x="12" y="16" width="16" height="26" rx="5" fill="#dc2626"/>
      <rect x="4" y="18" width="7" height="22" rx="3.5"/><rect x="29" y="18" width="7" height="22" rx="3.5"/>
      <rect x="13" y="42" width="6.5" height="26" rx="3"/><rect x="20.5" y="42" width="6.5" height="26" rx="3"/>
    </g></svg></div>`;
}

// ====================== LIGHTBOX (galerie avec navigation) ======================
let lbImgs = [], lbLabels = [], lbIdx = 0;
function openLightbox(imgs, labels, idx){
  lbImgs = imgs || []; lbLabels = labels || []; lbIdx = idx || 0;
  paintLightbox();
  const lb = document.getElementById('lightbox');
  lb.classList.remove('hidden'); lb.classList.add('flex');
}
function paintLightbox(){
  if(!lbImgs.length) return;
  if(lbIdx<0) lbIdx = lbImgs.length-1;
  if(lbIdx>=lbImgs.length) lbIdx = 0;
  document.getElementById('lightbox-img').src = lbImgs[lbIdx];
  const cap = lbLabels[lbIdx] ? `${lbLabels[lbIdx]} · ${lbIdx+1}/${lbImgs.length}` : `${lbIdx+1}/${lbImgs.length}`;
  document.getElementById('lightbox-cap').textContent = cap;
  const multi = lbImgs.length>1;
  document.getElementById('lightbox-prev').classList.toggle('hidden', !multi);
  document.getElementById('lightbox-next').classList.toggle('hidden', !multi);
}
function lightboxNav(d){ lbIdx += d; paintLightbox(); }
// clic pour agrandir une image seule (compat)
function openImg(src){ openLightbox([src], [], 0); }
function closeImg(){
  const lb = document.getElementById('lightbox');
  lb.classList.add('hidden'); lb.classList.remove('flex');
}

// ====================== RENDU SÉANCE ======================
function fmtDate(){
  return new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
}
function lastPerfStr(lp){
  if(!lp) return '';
  if(lp.poids && lp.reps) return lp.poids.map((p,i)=>`${p}×${lp.reps[i]}`).join(' · ');
  if(lp.assistance && lp.reps) return lp.assistance.map((p,i)=>`aide ${p}kg×${lp.reps[i]}`).join(' · ');
  if(lp.details) return lp.details;
  if(lp.note) return lp.note;
  return '';
}

            <span class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-gray-600 pointer-events-none">${unit}</span>

// ---- Câblage d'un bouton OK (valider une série → glow + progression + timer) ----
function wireOkBtn(btn){
  btn.addEventListener('click', ()=>{
    ensureNotifyPermission();
    const row = btn.closest('[data-serie]');
    row.classList.add('done-glow','rounded-xl','p-1','-m-1');
    btn.textContent = '✓';
    btn.classList.remove('bg-card2','border-white/10');
    btn.classList.add('bg-green-600','border-green-500','text-white');

    startTimer(parseInt(btn.dataset.repos,10), row.closest('[data-exo]').querySelector('h2').textContent);

// ---- Ajout d'une série supplémentaire ----
function addSerie(btn){

function updateProgress(){
  const total = document.querySelectorAll('.ok-btn').length;
  const done = document.querySelectorAll('.ok-btn.bg-green-600').length;
  document.getElementById('progress-bar').style.width = (total?done/total*100:0)+'%';
}

// ====================== TIMER (basé sur un timestamp de fin absolu) ======================
// Le repos est ancré sur un timestamp de fin (timerEndAt = Date.now()+durée). Le temps
// restant est TOUJOURS recalculé depuis Date.now() : le compteur ne peut donc jamais
// dériver, même si iOS/Safari gèle le JS quand l'appli passe en arrière-plan ou que le
// téléphone se verrouille. RATTRAPAGE : dès que la page redevient visible, on recalcule ;
// si le repos a réellement expiré pendant l'absence, le timer se TERMINE immédiatement
// (beep + vibration + GO). Sinon il affiche le vrai restant. → jamais un mauvais compte.
let timerId=null;          // id du setInterval de repeinture
let timerEndAt=0;          // timestamp (ms) de fin
let timerTotal=0;          // durée totale (s) pour l'anneau
let timerDone=false;       // a déjà sonné (évite double déclenchement)
const timerEl = document.getElementById('timer');
const timerNum = document.getElementById('timer-num');
const timerCircle = document.getElementById('timer-circle');
const timerPauseEl = document.getElementById('timer-pause');
const CIRC = 283;

function fmtTime(s){ const m=Math.floor(s/60), r=s%60; return `${m}:${String(r).padStart(2,'0')}`; }

// millisecondes restantes, toujours dérivées de l'horloge réelle
function timerMsLeft(){ return timerEndAt - Date.now(); }

function paintTimer(){
  const msLeft = Math.max(0, timerMsLeft());
  const secDisp = Math.ceil(msLeft/1000);
  if(!timerDone) timerNum.textContent = fmtTime(secDisp);
  const frac = timerTotal ? (msLeft/1000)/timerTotal : 0;
  timerCircle.style.strokeDashoffset = CIRC*(1 - Math.max(0, Math.min(1, frac)));
}

function tick(){
  if(timerDone) return;
  if(timerMsLeft() <= 0){ paintTimer(); endTimer(); return; }
  paintTimer();
}

function startTimer(seconds, exoName){
  seconds = seconds || 90;
  timerTotal = seconds;
  timerEndAt = Date.now() + seconds*1000;
  timerDone = false;
  document.getElementById('timer-exo').textContent = exoName || '';
  timerPauseEl.classList.add('hidden');
  timerEl.classList.remove('hidden'); timerEl.classList.add('flex');
  paintTimer();
  clearInterval(timerId);
  timerId = setInterval(tick, 250);
}

function timerActive(){
  return !timerEl.classList.contains('hidden');
}

function closeTimer(){
  clearInterval(timerId); timerId=null;
  timerEl.classList.add('hidden'); timerEl.classList.remove('flex');
  timerPauseEl.classList.add('hidden');
}

function endTimer(){
  if(timerDone) return;
  timerDone = true;
  clearInterval(timerId); timerId=null;
  beep(); vibrate([200,100,200,100,300]);
  notifyRestDone();
  timerNum.textContent = 'GO 💥';
  timerPauseEl.classList.add('hidden');
  timerCircle.style.strokeDashoffset = 0;
  setTimeout(closeTimer, 1400);
}

document.getElementById('timer-skip').addEventListener('click', closeTimer);
document.getElementById('timer-add').addEventListener('click', ()=>{
  if(timerDone) return;
  timerTotal += 30;
  timerEndAt += 30000;
  paintTimer();
});

// Rattrapage au retour d'arrière-plan : on recalcule sur l'horloge réelle.
function syncTimer(){
  if(!timerActive() || timerDone) return;
  timerPauseEl.classList.add('hidden');
  if(timerMsLeft() <= 0) endTimer();   // le repos a expiré pendant l'absence → GO tout de suite
  else paintTimer();
}
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){
    // JS va être gelé par iOS : on signale juste que le décompte continue sur l'horloge réelle
    if(timerActive() && !timerDone) timerPauseEl.classList.remove('hidden');
  } else {
    syncTimer();
  }
});
// Retour depuis le cache/bfcache (déverrouillage iOS) → resynchroniser
window.addEventListener('pageshow', syncTimer);
window.addEventListener('focus', syncTimer);

// ---- Notifications Web (repos terminé même en arrière-plan) ----
// Sur Android/Chrome la notification s'affiche même appli en arrière-plan.
// Sur iOS Safari (PWA installée requise + iOS 16.4+) elle peut être RETARDÉE par le
// système car le JS est gelé en arrière-plan : la notif part au réveil du JS. C'est la
// meilleure solution web disponible ; le compte reste toujours juste grâce au rattrapage.
function ensureNotifyPermission(){
  try{
    if(!('Notification' in window)) return;
    if(Notification.permission === 'default'){
      Notification.requestPermission().catch(()=>{});
    }
  }catch(e){}
}
function notifyRestDone(){
  try{
    if(!('Notification' in window) || Notification.permission !== 'granted') return;
    // Inutile de notifier si l'écran est déjà sous les yeux de Kevin
    if(!document.hidden) return;
    const exo = document.getElementById('timer-exo').textContent || '';
    new Notification('⏱ Repos terminé — c\'est reparti !', {
      body: exo ? 'Prochaine série : '+exo : 'Prochaine série 💥',
      tag: 'kevin-rest-done', renotify: true
    });
  }catch(e){}
}

// ---- Son (Web Audio) ----
let audioCtx=null;
function beep(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const notes=[880,1174,1568];
    notes.forEach((f,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='sine'; o.frequency.value=f;
      const t=audioCtx.currentTime + i*0.18;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.4,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t+0.18);
    });
  }catch(e){}
}
function vibrate(pat){ if(navigator.vibrate) navigator.vibrate(pat); }
// débloque l'audio au 1er tap
document.body.addEventListener('touchstart', ()=>{ if(!audioCtx){ try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } }, {once:true});

// ====================== COPIE RÉSULTATS ======================
function copyResults(){
  const s = DATA[sessionKey];
  const dateStr = new Date().toLocaleDateString('fr-FR');
  let out = `SEANCE: ${s.nom.toUpperCase()} - ${dateStr}\n\n`;
  const cards = document.querySelectorAll('#exos > section');
  cards.forEach((card, ei)=>{
    const ex = s.exercices[parseInt(card.dataset.exo,10)] || {};
    const name = card.querySelector('h2').textContent;
    const unit = ex.last_performance && ex.last_performance.assistance ? 'kg (aide)' : 'kg';
    const rows = card.querySelectorAll('[data-serie]');
    const parts = [];
    rows.forEach((row, si)=>{
      const p = row.querySelector('.inp-poids');
      const r = row.querySelector('.inp-reps');
      const pv = p.value.trim() || p.placeholder.replace('—','');
      const rv = r.value.trim();
      if(pv || rv){
        parts.push(`S${si+1}: ${pv?pv+unit:'—'} x ${rv||'—'}`);
      }
    });
    const tag = ex.salle==='origine' ? ' [salle d\'origine — matériel différent, charges non comparables]' : '';
    out += `Exercice ${ei+1}: ${name}${tag}\n`;
    out += parts.length ? parts.join(' | ') + '\n\n' : '(non renseigné)\n\n';
  });
  out = out.trimEnd() + '\n';

  copyToClipboard(out);
}

function copyToClipboard(text){
  const done = ()=> showToast('✅ Copié — colle-le dans Telegram');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else {
    fallbackCopy(text,done);
  }
}
function fallbackCopy(text,cb){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){ prompt('Copie manuelle :', text); }
  document.body.removeChild(ta);
}

const toastEl = document.getElementById('toast');
let toastTid=null;
function showToast(msg){
  toastEl.textContent=msg;
  toastEl.classList.remove('opacity-0');
  toastEl.classList.add('opacity-100');
  clearTimeout(toastTid);
  toastTid=setTimeout(()=>{ toastEl.classList.add('opacity-0'); toastEl.classList.remove('opacity-100'); },2500);
}
</script>
